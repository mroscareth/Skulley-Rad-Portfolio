  <script>
    // Solo en local (Oscar, 2026-11-18): las pestañas que abren los agentes en
    // segundo plano no suenan. Con la pestaña oculta, o con localStorage
    // skulley_mudo = '1', todo el audio va a una ganancia en 0 y los <audio> /
    // <video> se callan; al verse regresa (salvo con skulley_mudo).
    (function () {
      try {
        if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return
        var forzado = localStorage.getItem('skulley_mudo') === '1'
        var mudo = function () { return forzado || document.hidden }
        var ganancias = [], medios = new Set()
        var AC = window.AudioContext || window.webkitAudioContext
        if (AC) {
          window.AudioContext = window.webkitAudioContext = class extends AC {
            constructor(o) {
              super(o)
              var g = this.createGain()
              g.gain.value = mudo() ? 0 : 1
              g.connect(this.destination)
              Object.defineProperty(this, 'destination', { value: g })
              ganancias.push(g)
            }
          }
        }
        var P = HTMLMediaElement.prototype
        var desc = Object.getOwnPropertyDescriptor(P, 'muted')
        var aplica = function (el) { desc.set.call(el, !!el.__quiereMudo || mudo()) }
        Object.defineProperty(P, 'muted', {
          configurable: true,
          get: function () { return this.__quiereMudo === undefined ? desc.get.call(this) : this.__quiereMudo },
          set: function (v) { this.__quiereMudo = !!v; medios.add(this); aplica(this) },
        })
        var play = P.play
        P.play = function () {
          if (this.__quiereMudo === undefined) this.__quiereMudo = desc.get.call(this)
          medios.add(this); aplica(this)
          return play.apply(this, arguments)
        }
        if (window.speechSynthesis) {
          var habla = speechSynthesis.speak.bind(speechSynthesis)
          speechSynthesis.speak = function (u) { if (!mudo()) habla(u) }
        }
        document.addEventListener('visibilitychange', function () {
          var m = mudo()
          ganancias.forEach(function (g) { g.gain.value = m ? 0 : 1 })
          medios.forEach(aplica)
        })
      } catch (e) { }
    })()
  </script>

  <!-- ─────────────────────────────────────────────────────────────
       OPT-OUT DE ANALYTICS — corre ANTES que GA4 y que el beacon propio.
       Una cookie `mroscar_notrack=1` apaga los dos. Se pone sola al entrar
       al CMS (ver auth.php), se cambia a mano desde el dashboard, o se
       activa en cualquier aparato abriendo `?notrack=1` una vez.

       Va inline y no en un módulo porque tiene que decidir si el script de
       gtag se inyecta o no — para cuando el bundle de React monta, GA4 ya
       habría contado la visita.

       No es una barrera de seguridad: cualquiera puede ponerse la cookie
       para no ser contado. Para un contador propio eso da igual.
       ───────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var COOKIE = 'mroscar_notrack';
      try {
        // `?notrack=1` prende, `?notrack=0` apaga. Para el celular y el iPad,
        // donde nadie va a abrir el CMS.
        var m = /[?&]notrack=([01])/.exec(location.search);
        if (m) {
          document.cookie = m[1] === '1'
            ? COOKIE + '=1; path=/; max-age=63072000; samesite=lax'
            : COOKIE + '=; path=/; max-age=0; samesite=lax';
        }
        // Solo se cuenta en el sitio publicado. Un servidor local con la API
        // de producción (API_PROXY de vite.config.js) mandaba sus visitas al
        // contador real y a GA4: en noviembre de 2026 eran 127 visitas con
        // referrer localhost en el CMS.
        var publicado = /(^|\.)(skulleyrad\.com|mroscar\.xyz)$/.test(location.hostname);
        window.__madreNoTrack = !publicado || new RegExp('(^|;\\s*)' + COOKIE + '=1').test(document.cookie);
      } catch (e) {
        window.__madreNoTrack = false;
      }
    })();
  </script>

  <!-- Google Analytics 4 (GA4) — el <script> se inyecta solo si NO estás
       excluido. Con el tag estático no bastaba con no llamar a gtag(): el
       propio gtag.js manda el page_view automático al cargar. -->
  <script>
    (function () {
      if (window.__madreNoTrack) {
        // No-op para que un `gtag(...)` futuro no reviente estando excluido.
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { };
        return;
      }
      // En / y /simple, donde lo primero que sale es Skulley (el rig), el
      // script entra cuando él ya se ve (`skulley-listo`) o a los 12 s: en un
      // teléfono medio gtag.js ocupaba ~0.5 s del hilo antes de que arrancara
      // el sitio y, más tarde, en medio de la decodificación del modelo
      // (rendimiento.md, 2026-11-15). Las demás rutas, de inmediato, como
      // siempre. Lo de abajo ya queda en la cola con la hora de llegada.
      var cargado = false;
      var cargar = function () {
        if (cargado) return;
        cargado = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HG30WLMV35';
        document.head.appendChild(s);

      var ruta = location.pathname.replace(/\/+$/, '');
      if (ruta === '' || ruta === '/simple') {
        window.addEventListener('skulley-listo', function () { setTimeout(cargar, 800); }, { once: true });
        setTimeout(cargar, 12000);
      } else {
        cargar();
      }
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-HG30WLMV35');
    })();

        var lowThreads = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
        var highDPR = window.devicePixelRatio && window.devicePixelRatio > 2;
        // Con cualquiera de estas ya es modo ligero: el contexto WebGL de prueba
        // de abajo (~150 ms bloqueando el parseo en primera visita) sobra. En un
        // teléfono siempre pasa así.
        var yaLigero = Boolean(isMobileUA || coarse || saveData || lowMemory || lowThreads || highDPR);
        // GPU en DOS categorías. Antes era una sola lista y `intel` bastaba
        // por sí solo para degradar el sitio entero — pero eso incluye a las
        // Iris Xe y a las Arc dedicadas, y `apple gpu` incluye a TODOS los
        // Apple Silicon (M1–M4), que son rapidísimos. Resultado: máquinas de
        // 32 GB y 20 núcleos corriendo en modo degradado (medio orbe menos,
        // sin bloom/DOF/godrays, HDRI chico) sin que nadie se diera cuenta.
        var isWeakGPU = false;      // software o GPU de teléfono → degrada solo
        var isIntegratedGPU = false; // integrada de escritorio → necesita apoyo
        if (!yaLigero) try {
          var canvas = document.createElement('canvas');
          var gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
          if (gl) {
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            if (dbg) {
              var renderer = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
              isWeakGPU = /mali|adreno|powervr|swiftshader|llvmpipe|mesa/.test(renderer);
              isIntegratedGPU = /intel|apple gpu/.test(renderer);
            }
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          }
        } catch (e) { }
        // Una integrada de escritorio solo cuenta si viene acompañada de otra
        // señal de equipo flojo (poca RAM o pocos hilos). Sola no alcanza:
        // Chrome suele reportar la integrada aunque haya una dedicada.
        var weakCPU = (navigator.deviceMemory && navigator.deviceMemory <= 8)
          || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 8);
        mobile = Boolean(isMobileUA || coarse || saveData || lowMemory || lowThreads || highDPR
          || isWeakGPU || (isIntegratedGPU && weakCPU));
      } catch (e) { }
      window.__isMobilePerf = mobile;

      // ¿Teléfono? Entonces el sitio monta la versión de teléfono
      // (src/components/mobile/), que no usa HDRI: se ilumina con luces
      // propias. Precargarlo serían 516 KB tirados en el aparato que menos los
      // puede gastar. src/lib/mobileExperience.js decide lo mismo en vivo (al
      // hacer resize cambia de árbol); este cálculo solo cuenta al cargar.
      // Criterio (2026-10-30): teléfono (puntero grueso + lado CORTO <= 640px;
      // el lado corto, no el ancho: un teléfono acostado mide 844x390) o
      // ventana de 640px de ancho o menos. Los iPads se quedan en escritorio.
      // Mismo criterio que src/lib/mobileExperience.js: cambian juntos.
      var phone = false;
      try {
        var q = new URLSearchParams(window.location.search);
        if (q.get('full') === '1') phone = false;
        else if (q.get('mobile') === '1') phone = true;
        else {
          var width = window.innerWidth || 0;
          var coarsePointer = window.matchMedia
            && window.matchMedia('(pointer: coarse)').matches;
          var shortSide = Math.min(width, window.innerHeight || 0);
          phone = (width > 0 && width <= 640)
            || (Boolean(coarsePointer) && shortSide > 0 && shortSide <= 640);
        }
      } catch (e) { }
      window.__isPhoneExperience = phone;

      // La versión rápida (src/lib/versionRapida.js: /simple, o una sección
      // en la pestaña que ya entró a ella) no tiene escena 3D: tampoco usa el
      // HDRI. / y /world nunca son la rápida. Mismo criterio que VERSION_RAPIDA.
      var rapida = false;
      try {
        var qr = new URLSearchParams(window.location.search);
        var ruta = window.location.pathname.replace(/\/+$/, '');
        if (ruta === '/simple') rapida = true;
        else if (ruta === '') rapida = qr.get('rapida') === '1';
        else if (ruta !== '/world') {
          rapida = qr.get('full') !== '1' && sessionStorage.getItem('skulley_rapida') === '1';
        }
      } catch (e) { }

      if (!phone && !rapida) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.href = mobile ? '/light-mobile.hdr' : '/light.hdr';
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      }
    })();
  </script>

  <!-- Contador de visitas propio (api/analytics.php). Cuenta cada página: la
       primera y cada navegación del sitio (pushState y atrás/adelante). El
       tiempo por sección lo lleva el hook useDwellTimeTracking de React; aquí
       vivía otro rastreo por IntersectionObserver de cuando el sitio era una
       sola página, que contaba "/#section1" como visita y escribía el tiempo
       por segunda vez con otros nombres. -->
  <script>
    (function () {
      if (window.location.pathname.startsWith('/admin')) return;

      // Opt-out del dueño y servidores locales: lo resuelve el preámbulo de
      // arriba, el mismo que decide si GA4 carga. analytics.php lo vuelve a
      // checar por si un HTML cacheado se salta esto.
      if (window.__madreNoTrack) return;

      var sessionId = sessionStorage.getItem('_madre_sid');
      if (!sessionId) {
        sessionId = Math.random().toString(36).substr(2) + Date.now().toString(36);
        sessionStorage.setItem('_madre_sid', sessionId);
      }

      var nav = navigator;
      var conn = nav.connection || nav.mozConnection || nav.webkitConnection;
      var lastTracked = '';
      var trackUrl = '/api/analytics.php?action=track';
      // El referrer de afuera vale solo para la primera página; las demás
      // vienen del propio sitio.
      var referrer = document.referrer || '';

      function makePayload(page) {
        return {
          page: page,
          referrer: referrer,
          screen_w: screen.width,
          screen_h: screen.height,
          language: nav.language || '',
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
          dark_mode: window.matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0,
          touch: ('ontouchstart' in window || nav.maxTouchPoints > 0) ? 1 : 0,
          connection: conn ? (conn.effectiveType || conn.type || '') : '',
          color_depth: screen.colorDepth || 0,
          pixel_ratio: window.devicePixelRatio || 1,
          session_id: sessionId
        };
      }

      function sendBeacon(page) {
        if (page === lastTracked) return;
        lastTracked = page;
        try {
          var body = JSON.stringify(makePayload(page));
          referrer = '';
          if (navigator.sendBeacon) {
            navigator.sendBeacon(trackUrl, new Blob([body], { type: 'application/json' }));
          } else {
            fetch(trackUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () { });
          }
        } catch (e) { }
      }

      // La página es la ruta, sin consulta ni hash (?lang=es, ?pedido=… no
      // son otra página). Se manda un momento después de navegar: la URL a
      // veces se reescribe en el mismo tick (replaceState de las transiciones).
      var pendiente = 0;
      function contar(espera) {
        clearTimeout(pendiente);
        pendiente = setTimeout(function () {
          if (window.__madreNoTrack) return;
          sendBeacon(window.location.pathname.replace(/\/+$/, '') || '/');
        }, espera);
      }

      // 1. La primera página, a los 2 s (quien se va antes no cuenta).
      contar(2000);

      // 2. Cada navegación del sitio. Antes solo se escuchaba hashchange y las
      // rutas (/about, /work/…) nunca llegaban al contador.
      var push = history.pushState;
      history.pushState = function () {
        var r = push.apply(this, arguments);
        contar(400);
        return r;
      };
      window.addEventListener('popstate', function () { contar(400); });
    })();
  </script>
